name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Create deployment directory
        run: |
          mkdir -p _site
          cp -r index.html favicon.ico css js assets content CNAME .nojekyll _site/
          [ -f favicon.svg ] && cp favicon.svg _site/ || true
          [ -f favicon-96x96.png ] && cp favicon-96x96.png _site/ || true
          [ -f apple-touch-icon.png ] && cp apple-touch-icon.png _site/ || true
          [ -d node ] && cp -r node _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
